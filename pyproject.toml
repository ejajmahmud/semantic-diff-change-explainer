[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-diff-change-explainer"
version = "0.1.0"
description = "AST-aware unified diff analyzer generating structured human-readable release notes and impact summaries for pull requests"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
semantic-diff-change-explainer = "semantic_diff_change_explainer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["semantic_diff_change_explainer*"]
